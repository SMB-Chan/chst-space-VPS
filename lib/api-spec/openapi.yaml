openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /openai/models:
    get:
      operationId: listOpenaiModels
      tags: [openai]
      summary: List available chat models
      responses:
        "200":
          description: Available models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiModel"
  /openai/me:
    get:
      operationId: getOpenaiMe
      tags: [openai]
      summary: Identify the authenticated user
      description: >-
        Returns the authenticated Clerk user id. Used by the frontend access
        gate; a 403 means the account is not on the service allowlist.
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiMe"
  /openai/capabilities:
    get:
      operationId: listOpenaiCapabilities
      tags: [openai]
      summary: List chat and specialist AI capabilities
      responses:
        "200":
          description: Capability registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityRegistry"
  /openai/settings:
    get:
      operationId: getOpenaiSettings
      tags: [openai]
      summary: Get the account's stored UI settings
      responses:
        "200":
          description: Stored settings or null when never saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiSettingsEnvelope"
    put:
      operationId: putOpenaiSettings
      tags: [openai]
      summary: Store the account's UI settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiSettings"
      responses:
        "204":
          description: Stored
  /openai/realtime/session:
    post:
      operationId: createOpenaiRealtimeSession
      tags: [openai]
      summary: Create an authenticated Qwen Audio realtime session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealtimeSessionInput"
      responses:
        "200":
          description: Short-lived browser session ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeSession"
        "400":
          description: Invalid request or unavailable specialist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/video-jobs:
    post:
      operationId: createOpenaiVideoJob
      tags: [openai]
      summary: Start an authenticated asynchronous HappyHorse video generation job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiVideoJobInput"
      responses:
        "201":
          description: Created video generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiVideoJob"
        "200":
          description: Existing job returned for a repeated idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiVideoJob"
        "400":
          description: Invalid video request or missing confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "503":
          description: Provider submission or persistence is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/video-jobs/{jobId}:
    get:
      operationId: getOpenaiVideoJob
      tags: [openai]
      summary: Get an owned HappyHorse video generation job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Video generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiVideoJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: cancelOpenaiVideoJob
      tags: [openai]
      summary: Cancel an owned pending HappyHorse video generation job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Canceled or already terminal video job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiVideoJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "409":
          description: Job is no longer cancelable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "503":
          description: Realtime capacity is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/artifacts/{id}:
    get:
      operationId: downloadOpenaiArtifact
      tags: [openai]
      summary: Download a generated artifact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Artifact file
          content:
            text/plain: {}
            text/markdown: {}
            text/csv: {}
            application/json: {}
            text/html: {}
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
    delete:
      operationId: wipeOpenaiConversations
      tags: [openai]
      summary: Delete all conversations for the current user
      responses:
        "204":
          description: All conversations deleted
        "500":
          description: Failed to wipe conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/memories:
    delete:
      operationId: wipeOpenaiMemories
      tags: [openai]
      summary: Delete all long-term memories for the current user
      responses:
        "204":
          description: All long-term memories deleted
        "500":
          description: Failed to wipe long-term memories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    patch:
      operationId: updateOpenaiConversation
      tags: [openai]
      summary: Rename a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
        "400":
          description: Invalid title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: model
          in: query
          required: false
          schema:
            type: string
          description: Model ID to use for the response
        - name: reasoning
          in: query
          required: false
          schema:
            type: string
            enum: [off, low, medium, high]
          description: Reasoning level for the primary model
        - name: auditModel
          in: query
          required: false
          schema:
            type: string
          description: Optional model ID to audit the response
        - name: auditReasoning
          in: query
          required: false
          schema:
            type: string
            enum: [off, low, medium, high]
          description: Reasoning level for the audit model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
  /openai/ephemeral/messages:
    post:
      operationId: sendOpenaiEphemeralMessage
      tags: [openai]
      summary: Send a private-session message without persisting the conversation
      parameters:
        - name: model
          in: query
          required: false
          schema:
            type: string
        - name: reasoning
          in: query
          required: false
          schema:
            type: string
            enum: [off, low, medium, high]
        - name: auditModel
          in: query
          required: false
          schema:
            type: string
        - name: auditReasoning
          in: query
          required: false
          schema:
            type: string
            enum: [off, low, medium, high]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid message, attachment, model, or private-mode file request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/messages:
    delete:
      operationId: deleteOpenaiMessages
      tags: [openai]
      summary: Delete owned messages by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageDeleteInput"
      responses:
        "204":
          description: Deleted
        "404":
          description: No owned messages found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/assets/{assetId}:
    get:
      operationId: getOpenaiAsset
      tags: [openai]
      summary: Download a generated asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Asset binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid asset id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
components:
  schemas:
    OpenaiSettings:
      type: object
      required:
        - defaultModel
        - defaultReasoning
        - auditEnabled
        - auditModelId
        - auditReasoning
        - translationMode
      properties:
        defaultModel:
          type: string
          maxLength: 120
        defaultReasoning:
          type: string
          enum: [off, low, medium, high]
        auditEnabled:
          type: boolean
        auditModelId:
          type: string
          maxLength: 120
        auditReasoning:
          type: string
          enum: [off, low, medium, high]
        translationMode:
          type: string
          enum:
            - off
            - auto
            - ja-en
            - en-ja
            - auto-ko
            - ja-ko
            - ko-ja
            - auto-zh
            - ja-zh
            - zh-ja
    OpenaiSettingsEnvelope:
      type: object
      required: [settings]
      properties:
        settings:
          oneOf:
            - $ref: "#/components/schemas/OpenaiSettings"
            - type: "null"
    OpenaiMe:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
          description: Clerk user id of the authenticated account
        role:
          type: string
          enum: [admin, user]
          description: Admins keep full provider access and reach moderation APIs.
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OpenaiModel:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        provider:
          type: string
          enum: [openai, dashscope, openrouter, xiaomi]
        description:
          type: string
        supportsVision:
          type: boolean
        supportsReasoning:
          type: boolean
        reasoning:
          type: string
          enum: [none, openai, dashscope, openrouter, xiaomi]
      required:
        - id
        - label
        - provider
        - description
        - supportsVision
        - supportsReasoning
        - reasoning
    CapabilityRegistry:
      type: object
      properties:
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityDescriptor"
        models:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityModel"
      required: [capabilities, models]
    CapabilityDescriptor:
      type: object
      properties:
        id:
          type: string
          enum:
            [
              chat,
              reasoning,
              vision,
              image-generate,
              image-edit,
              speech-to-text,
              audio-synthesis,
              realtime,
              video,
            ]
        label:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [available, catalog-only]
        models:
          type: array
          items:
            type: string
      required: [id, label, description, status, models]
    CapabilityModel:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        provider:
          type: string
          enum: [openai, dashscope, openrouter, xiaomi]
        capabilities:
          type: array
          items:
            type: string
            enum:
              [
                chat,
                reasoning,
                vision,
                image-generate,
                image-edit,
                speech-to-text,
                audio-synthesis,
                realtime,
                video,
              ]
        configured:
          type: boolean
      required: [id, label, provider, capabilities, configured]
    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    OpenaiSource:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
        fetchedAt:
          type: string
          format: date-time
          nullable: true
        publisherName:
          type: string
          nullable: true
        publisherUrl:
          type: string
          format: uri
          nullable: true
      required:
        - title
        - url
    OpenaiArtifact:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        mime:
          type: string
        size:
          type: integer
        downloadUrl:
          type: string
      required:
        - id
        - filename
        - mime
        - size
        - downloadUrl
    OpenaiGeneratedAsset:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        downloadUrl:
          type: string
      required:
        - id
        - filename
        - mimeType
        - size
        - downloadUrl
    OpenaiFactualityClaim:
      type: object
      properties:
        claim:
          type: string
        verdict:
          type: string
          enum: [supported, contradicted, unknown]
        sourceIds:
          type: array
          items:
            type: integer
        reason:
          type: string
      required:
        - claim
        - verdict
        - sourceIds
        - reason
    OpenaiFactualityReport:
      type: object
      properties:
        status:
          type: string
          enum: [verified, mixed, insufficient]
        summary:
          type: string
        claims:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiFactualityClaim"
        modelId:
          type: string
        corrected:
          type: boolean
        researchQuality:
          allOf:
            - $ref: "#/components/schemas/OpenaiNewsQualityReport"
          nullable: true
      required:
        - status
        - summary
        - claims
        - modelId
        - corrected
    OpenaiNewsQualityReport:
      type: object
      properties:
        kind:
          type: string
          enum: [news]
        quality:
          type: string
          enum: [good, partial, poor]
        taskSuccess:
          type: string
          enum: [succeeded, failed, unknown]
        acceptedSourceCount:
          type: integer
        freshSourceCount:
          type: integer
        independentDomainCount:
          type: integer
        officialOrMajorSourceCount:
          type: integer
        queries:
          type: array
          items:
            type: string
      required:
        - kind
        - quality
        - taskSuccess
        - acceptedSourceCount
        - freshSourceCount
        - independentDomainCount
        - officialOrMajorSourceCount
        - queries
    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        modelId:
          type: string
          nullable: true
        sources:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiSource"
          nullable: true
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiArtifact"
          nullable: true
        auditContent:
          type: string
          nullable: true
        auditModelId:
          type: string
          nullable: true
        factuality:
          allOf:
            - $ref: "#/components/schemas/OpenaiFactualityReport"
          nullable: true
        assetIds:
          type: array
          items:
            type: integer
          nullable: true
        generatedAssets:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiGeneratedAsset"
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
      required:
        - title
    OpenaiAttachment:
      type: object
      properties:
        kind:
          type: string
          enum: [image, file]
        name:
          type: string
          minLength: 1
          maxLength: 255
        content:
          type: string
          description: Data URL for images, UTF-8 text for text attachments
        isBase64:
          type: boolean
          description: Compatibility hint; kind is authoritative
      required:
        - kind
        - name
        - content
    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
          description: User question. May be empty when attachments are present; legacy CS_ATTACHMENTS_V1 envelopes remain accepted.
        modelId:
          type: string
          description: Model ID to use (overrides the query parameter)
        attachments:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/OpenaiAttachment"
        fileFormat:
          type: string
          description: Optional target file format for generated downloads (pdf, docx, xlsx, pptx)
          enum: [pdf, docx, xlsx, pptx]
        history:
          type: array
          maxItems: 200
          description: Conversation history for ephemeral/private mode
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
                minLength: 1
              attachments:
                type: array
                maxItems: 5
                items:
                  $ref: "#/components/schemas/OpenaiAttachment"
            required:
              - role
              - content
      required:
        - content
    OpenaiMessageDeleteInput:
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: integer
            minimum: 1
      required:
        - ids
    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    RealtimeSessionInput:
      type: object
      properties:
        conversationId:
          type: integer
          minimum: 1
        modelId:
          type: string
          minLength: 1
      required: [modelId]
    RealtimeSession:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: integer
        modelId:
          type: string
          enum: [qwen-audio-3.0-realtime-plus]
        websocketPath:
          type: string
          enum: [/api/openai/realtime]
        maxSessionSeconds:
          type: integer
          enum: [300]
      required: [token, expiresAt, modelId, websocketPath, maxSessionSeconds]
    OpenaiVideoJobInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 5000
        mode:
          type: string
          enum: [t2v, i2v, r2v]
        modelId:
          type: string
        referenceImages:
          type: array
          maxItems: 9
          items:
            type: string
        resolution:
          type: string
          enum: [720P, 1080P]
        ratio:
          type: string
          enum:
            ["16:9", "9:16", "1:1", "4:3", "3:4", "4:5", "5:4", "9:21", "21:9"]
        duration:
          type: integer
          minimum: 3
          maximum: 15
        watermark:
          type: boolean
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
        confirmation:
          type: boolean
          enum: [true]
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 128
      required: [prompt, mode, confirmation, idempotencyKey]
    OpenaiVideoJobAsset:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        mimeType:
          type: string
          enum: [video/mp4]
        size:
          type: integer
        downloadUrl:
