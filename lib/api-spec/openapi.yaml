openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /openai/models:
    get:
      operationId: listOpenaiModels
      tags: [openai]
      summary: List available chat models
      responses:
        "200":
          description: Available models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiModel"
  /openai/capabilities:
    get:
      operationId: listOpenaiCapabilities
      tags: [openai]
      summary: List chat and specialist AI capabilities
      responses:
        "200":
          description: Capability registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityRegistry"
  /openai/artifacts/{id}:
    get:
      operationId: downloadOpenaiArtifact
      tags: [openai]
      summary: Download a generated artifact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Artifact file
          content:
            text/plain: {}
            text/markdown: {}
            text/csv: {}
            application/json: {}
            text/html: {}
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
    delete:
      operationId: wipeOpenaiConversations
      tags: [openai]
      summary: Delete all conversations for the current user
      responses:
        "204":
          description: All conversations deleted
        "500":
          description: Failed to wipe conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    patch:
      operationId: updateOpenaiConversation
      tags: [openai]
      summary: Rename a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
        "400":
          description: Invalid title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: model
          in: query
          required: false
          schema:
            type: string
          description: Model ID to use for the response
        - name: reasoning
          in: query
          required: false
          schema:
            type: string
            enum: [off, low, medium, high]
          description: Reasoning level for the primary model
        - name: auditModel
          in: query
          required: false
          schema:
            type: string
          description: Optional model ID to audit the response
        - name: auditReasoning
          in: query
          required: false
          schema:
            type: string
            enum: [off, low, medium, high]
          description: Reasoning level for the audit model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
  /openai/ephemeral/messages:
    post:
      operationId: sendOpenaiEphemeralMessage
      tags: [openai]
      summary: Send a private-session message without persisting the conversation
      parameters:
        - name: model
          in: query
          required: false
          schema:
            type: string
        - name: reasoning
          in: query
          required: false
          schema:
            type: string
            enum: [off, low, medium, high]
        - name: auditModel
          in: query
          required: false
          schema:
            type: string
        - name: auditReasoning
          in: query
          required: false
          schema:
            type: string
            enum: [off, low, medium, high]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid message, attachment, model, or private-mode file request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/messages:
    delete:
      operationId: deleteOpenaiMessages
      tags: [openai]
      summary: Delete owned messages by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageDeleteInput"
      responses:
        "204":
          description: Deleted
        "404":
          description: No owned messages found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/assets/{assetId}:
    get:
      operationId: getOpenaiAsset
      tags: [openai]
      summary: Download a generated asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Asset binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid asset id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OpenaiModel:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        provider:
          type: string
          enum: [openai, dashscope]
        description:
          type: string
        supportsVision:
          type: boolean
        supportsReasoning:
          type: boolean
        reasoning:
          type: string
          enum: [none, openai, dashscope]
      required:
        - id
        - label
        - provider
        - description
        - supportsVision
        - supportsReasoning
        - reasoning
    CapabilityRegistry:
      type: object
      properties:
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityDescriptor"
        models:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityModel"
      required: [capabilities, models]
    CapabilityDescriptor:
      type: object
      properties:
        id:
          type: string
          enum: [chat, reasoning, vision, image-generate, image-edit, speech-to-text, audio-synthesis, realtime, video]
        label:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [available, catalog-only]
        models:
          type: array
          items:
            type: string
      required: [id, label, description, status, models]
    CapabilityModel:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        provider:
          type: string
          enum: [openai, dashscope]
        capabilities:
          type: array
          items:
            type: string
            enum: [chat, reasoning, vision, image-generate, image-edit, speech-to-text, audio-synthesis, realtime, video]
        configured:
          type: boolean
      required: [id, label, provider, capabilities, configured]
    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    OpenaiSource:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
        fetchedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - title
        - url
    OpenaiArtifact:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        mime:
          type: string
        size:
          type: integer
        downloadUrl:
          type: string
      required:
        - id
        - filename
        - mime
        - size
        - downloadUrl
    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        modelId:
          type: string
          nullable: true
        sources:
          type: array
          items:
            $ref: '#/components/schemas/OpenaiSource'
          nullable: true
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/OpenaiArtifact'
          nullable: true
        auditContent:
          type: string
          nullable: true
        auditModelId:
          type: string
          nullable: true
        assetIds:
          type: array
          items:
            type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
      required:
        - title
    OpenaiAttachment:
      type: object
      properties:
        kind:
          type: string
          enum: [image, file]
        name:
          type: string
          minLength: 1
          maxLength: 255
        content:
          type: string
          description: Data URL for images, UTF-8 text for text attachments
        isBase64:
          type: boolean
          description: Compatibility hint; kind is authoritative
      required:
        - kind
        - name
        - content
    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
          description: User question. May be empty when attachments are present; legacy CS_ATTACHMENTS_V1 envelopes remain accepted.
        modelId:
          type: string
          description: Model ID to use (overrides the query parameter)
        attachments:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/OpenaiAttachment"
        fileFormat:
          type: string
          description: Optional target file format for generated downloads (pdf, docx, xlsx, pptx)
          enum: [pdf, docx, xlsx, pptx]
        history:
          type: array
          maxItems: 200
          description: Conversation history for ephemeral/private mode
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
                minLength: 1
              attachments:
                type: array
                maxItems: 5
                items:
                  $ref: "#/components/schemas/OpenaiAttachment"
            required:
              - role
              - content
      required:
        - content
    OpenaiMessageDeleteInput:
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: integer
            minimum: 1
      required:
        - ids
    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
