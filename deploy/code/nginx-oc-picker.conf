# opencode "add project" picker injection (served by nginx in front of code).
# Install as /etc/nginx/conf.d/oc-picker.conf on the VPS.
# $connection_upgrade must be defined exactly once nginx-wide.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 127.0.0.1:8096;
    server_name _;

    location = /__oc_picker.js {
        alias /opt/oc-picker/picker.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://127.0.0.1:4096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Accept-Encoding "";
        sub_filter "</head>" "<script src=\"/__oc_picker.js\"></script></head>";
        sub_filter_once on;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
    }
}
