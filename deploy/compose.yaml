name: chat-space

services:
  db:
    image: postgres:16-alpine
    container_name: chat-space-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: chat_space
    volumes:
      - chatpg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat_space"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  searxng:
    image: searxng/searxng:latest
    container_name: chat-space-searxng
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_LIMITER: "false"
    ports:
      - "127.0.0.1:8888:8080"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  app:
    image: chat-space:app
    container_name: chat-space-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:5000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true

  # VPS coding environment (OpenCode web). Replaces the standalone
  # /opt/opencode-sandbox stack. Workspace lives under this deploy tree.
  code:
    image: chat-space:code
    container_name: chat-space-code
    restart: unless-stopped
    init: true
    build:
      context: ./code
    command: ["opencode", "serve", "--hostname", "0.0.0.0", "--port", "4096"]
    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
    ports:
      - "127.0.0.1:4096:4096"
    volumes:
      - ../code-workspace:/workspace
      - code-data:/home/node/.local/share/opencode
      - code-github:/home/node/.config/gh
      - code-npm:/home/node/.npm
    mem_limit: 3g
    cpus: 3.0
    pids_limit: 1024
    security_opt:
      - no-new-privileges:true

volumes:
  chatpg:
  code-data:
  code-github:
  code-npm:

