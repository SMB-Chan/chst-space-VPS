name: Repair lockfile

on:
  push:
    branches: [audit/hardening-2026-08-22]

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: repaired-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
