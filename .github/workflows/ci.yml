name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-file-generation-boundary:
    if: github.event_name == 'pull_request' && github.head_ref == 'hardening/file-generation-trust-boundary'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/file-generation-trust-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-file-generation-trust-boundary-rest.mjs
      - run: git diff --check
      - name: Commit prepared source changes
        run: |
          if git diff --quiet; then
            echo "Trust-boundary source changes already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/lib/chat-stream.ts \
                  artifacts/api-server/src/lib/file-generation.test.ts \
                  artifacts/api-server/src/lib/chat-stream.file-generation.test.ts
          git commit -m "fix(file-generation): enforce system/user trust boundary"
          git push origin HEAD:hardening/file-generation-trust-boundary

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:api-routes
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm --filter @workspace/api-server run test:ssrf
      - name: Verify generated API clients are reproducible
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git diff --exit-code -- \
            lib/api-client-react/src/generated \
            lib/api-zod/src/generated \
            lib/api-zod/src/index.ts
      - run: pnpm run build

  production-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chatspace
          POSTGRES_PASSWORD: chatspace
          POSTGRES_DB: chatspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U chatspace -d chatspace"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://chatspace:chatspace@127.0.0.1:5432/chatspace
      AI_INTEGRATIONS_OPENAI_BASE_URL: http://example.test/v1
      AI_INTEGRATIONS_OPENAI_API_KEY: test-key
      NODE_ENV: production
      PORT: 5000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db run push
      - run: pnpm --filter @workspace/api-server run build
      - name: Boot production bundle and probe readiness
        working-directory: artifacts/api-server
        run: |
          node --enable-source-maps ./dist/index.mjs > /tmp/chat-space-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/chat-space-api.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/api/healthz > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          echo "Production API failed readiness probe" >&2
          exit 1
