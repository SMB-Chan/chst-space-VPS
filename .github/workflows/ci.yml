name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run check:api-routes
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm --filter @workspace/api-server run test:ssrf
      - name: Verify generated API clients are reproducible
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git diff --exit-code -- \
            lib/api-client-react/src/generated \
            lib/api-zod/src/generated \
            lib/api-zod/src/index.ts
      - run: pnpm run build

  production-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chatspace
          POSTGRES_PASSWORD: chatspace
          POSTGRES_DB: chatspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U chatspace -d chatspace"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://chatspace:chatspace@127.0.0.1:5432/chatspace
      AI_INTEGRATIONS_OPENAI_BASE_URL: http://example.test/v1
      AI_INTEGRATIONS_OPENAI_API_KEY: test-key
      NODE_ENV: production
      PORT: 5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db run push
      - name: Verify shared coordination and completion transactions against PostgreSQL
        run: |
          pnpm --filter @workspace/api-server exec vitest run --config ./vitest.config.ts \
            src/middlewares/sharedAiUsageGuard.pg.test.ts \
            src/lib/completion-persistence.pg.test.ts
      - run: pnpm --filter @workspace/api-server run build
      - name: Boot production bundle and probe readiness
        working-directory: artifacts/api-server
        run: |
          node --enable-source-maps ./dist/index.mjs > /tmp/chat-space-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/chat-space-api.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --dump-header /tmp/health.headers \
              http://127.0.0.1:5000/api/healthz > /tmp/health.json; then
              cat /tmp/health.json
              grep -qi '^Cache-Control: private, no-store' /tmp/health.headers
              grep -qi '^X-Content-Type-Options: nosniff' /tmp/health.headers
              grep -qi '^X-Frame-Options: DENY' /tmp/health.headers
              grep -qi '^Referrer-Policy: no-referrer' /tmp/health.headers
              grep -qi "^Content-Security-Policy: default-src 'none'; frame-ancestors 'none'; base-uri 'none'" /tmp/health.headers
              if grep -qi '^X-Powered-By:' /tmp/health.headers; then
                echo "X-Powered-By must not be exposed" >&2
                exit 1
              fi
              if grep -Eq 'aiUsageLimiter|browserFetch|browserEgress' /tmp/health.json; then
                echo "Unauthenticated health response must not expose operational counters" >&2
                exit 1
              fi
              exit 0
            fi
            sleep 1
          done
          echo "Production API failed readiness probe" >&2
          exit 1
