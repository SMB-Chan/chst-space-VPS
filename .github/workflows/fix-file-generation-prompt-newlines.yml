name: Fix file-generation prompt newlines

on:
  push:
    branches: [hotfix/file-generation-prompt-newlines]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix(file-generation): use real prompt newlines'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/file-generation-prompt-newlines
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fix-file-generation-prompt-newlines.mjs
      - run: git diff --check
      - name: Commit corrected prompt newlines
        run: |
          if git diff --quiet; then
            echo "No newline corrections needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/lib/file-generation.ts \
                  artifacts/api-server/src/lib/file-generation.test.ts
          git commit -m "fix(file-generation): use real prompt newlines"
          git push origin HEAD:hotfix/file-generation-prompt-newlines
